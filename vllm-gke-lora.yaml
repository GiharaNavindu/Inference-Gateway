apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  labels:
    app: vllm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
        scrape: "true" 
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args: 
        - "--model=microsoft/Phi-3.5-mini-instruct"
        - "--gpu-memory-utilization=0.90"
        - "--max-model-len=4096"
        - "--enable-lora"
        - "--max-loras=4"
        - "--max-cpu-loras=8"
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
