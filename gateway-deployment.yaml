apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiforge-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiforge-gateway
  template:
    metadata:
      labels:
        app: aiforge-gateway
    spec:
      containers:
      - name: gateway
        image: gcr.io/hack-506414/aiforge-gateway:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aiforge-gateway-svc
spec:
  type: LoadBalancer
  selector:
    app: aiforge-gateway
  ports:
  - port: 80
    targetPort: 80
