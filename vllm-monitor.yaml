apiVersion: v1
kind: Service
metadata:
  name: vllm-server
  labels:
    app: vllm-server
spec:
  type: ClusterIP
  selector:
    app: vllm-server
  ports:
  - name: http-metrics
    port: 8000
    targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-monitor
  namespace: default
spec:
  selector:
    matchLabels:
      app: vllm-server
  endpoints:
  - port: http-metrics
    path: /metrics
    interval: 15s
